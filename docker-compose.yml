# Shared by every service that talks to the database or the LLM. Defined once so
# `migrate`, `backend` and `worker` cannot drift apart.
x-backend-env: &backend-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: appdb
  DB_USER: appuser
  DB_PASSWORD: apppassword
  REDIS_URL: redis://valkey:6379
  # LLM provider — real values come from the shell/.env at deploy time
  # (scripts/deploy.sh exports them; never commit the key itself).
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
  LLM_API_KEY: ${LLM_API_KEY:-local-llama-cpp}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
  LLM_MAX_RUNS: ${LLM_MAX_RUNS:-3}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side port only; containers still reach Postgres on 5432. On Windows,
      # Hyper-V/WinNAT reserves blocks around the default 5432 (e.g. 5087-5557),
      # which makes Docker fail with "socket ... forbidden by its access permissions".
      # Override with DB_HOST_PORT if 55432 is ever reserved too.
      - "${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema sync. `manage.py migrate` is a no-op when nothing is pending, so
  # this runs on every `docker compose up` and the API can never serve against a
  # schema the models have outgrown. backend/worker wait for it to exit 0; without
  # that, a fresh DB (migration 0031 etc.) made every student/lecturer endpoint 500.
  migrate:
    build: ./backend
    container_name: migrate
    command: python manage.py migrate --noinput
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Analysis worker (same image, polling queue). NOT used by deploy.sh any more: the
  # backend supervises `analyze_submissions` and `drain_reading_materials` itself
  # (api/worker_supervisor.py, migration 0029), so starting this too would duplicate the
  # analysis loop. Kept profile-gated as the manual escape hatch for when AUTO_WORKER=0:
  #   docker compose --profile worker up -d worker
  worker:
    profiles: ["worker"]
    build: ./backend
    container_name: worker
    command: python manage.py analyze_submissions --loop --interval 5
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
