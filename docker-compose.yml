services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      REDIS_URL: redis://valkey:6379
      # LLM provider — real values come from the shell/.env at deploy time
      # (scripts/deploy.sh exports them; never commit the key itself).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-llama-cpp}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_RUNS: ${LLM_MAX_RUNS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # P4 analysis worker (same image, polling queue). Profile-gated so it only
  # starts when explicitly enabled (deploy.sh does this once a real
  # LLM_API_KEY exists in .env); without a key it would fail every analysis
  # to ANALYSIS_FAILED in a bounded retry loop.
  worker:
    profiles: ["worker"]
    build: ./backend
    container_name: worker
    command: python manage.py analyze_submissions --loop --interval 5
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-llama-cpp}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_RUNS: ${LLM_MAX_RUNS:-3}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
