name: Deploy to VPS (SSH via Cloudflare Tunnel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ssh
  cancel-in-progress: true

jobs:
  # Gate: nothing reaches the VPS unless the build is provably sound. Kept inside the
  # deploy workflow (not a separate ci.yml) because this repo has no branch protection --
  # a separate workflow would run and be ignored. `needs:` is the only mechanism here
  # that actually blocks a deploy.
  #
  # Why exactly these checks: `manage.py test api` CANNOT pass in this repo (the domain
  # tables are unmanaged V2 SQL, so the auto-created test DB has no `users` table). The
  # three modules below are SimpleTestCase -- DB-free and secret-free, verified by running
  # them with every DB_*/LLM_*/EMBEDDINGS_* variable unset: 246 tests, OK.
  # `next build` alone is NOT a type check -- Next transpiles without type-checking, which
  # is how a ReferenceError once shipped past a green build (2026-10-17). tsc runs separately.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests (DB-free, no secrets)
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt
          python manage.py test api.tests_question_bank api.tests_worker_supervisor api.tests_reference_materials

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck, then build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_HOST: ssh.yavuzz.online
      VPS_USER: ${{ secrets.VPS_SSH_USER }}
      DEPLOY_DIR: /home/ubuntu/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare TCP proxy for SSH
        run: |
          cloudflared access tcp \
            --hostname $CF_HOST \
            --url 127.0.0.1:2222 \
            --service-token-id "${{ secrets.CF_SERVICE_TOKEN_ID }}" \
            --service-token-secret "${{ secrets.CF_SERVICE_TOKEN_SECRET }}" \
            --logfile /tmp/cloudflared.log --loglevel info &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              echo "proxy ready"
              exit 0
            fi
            sleep 2
          done
          echo "--- cloudflared log ---"
          cat /tmp/cloudflared.log 2>/dev/null || true
          echo "proxy failed to start"
          exit 1

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Sync code to VPS
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 -i ~/.ssh/id_deploy" \
            --exclude node_modules --exclude .next --exclude venv --exclude __pycache__ \
            --exclude .git --exclude "*.pyc" --exclude .env \
            --exclude backend/media \
            ./ $VPS_USER@127.0.0.1:$DEPLOY_DIR/

      # Materialize runtime secrets on the VPS from GitHub Secrets (repo-safe:
      # values never enter git or rsync). deploy.sh sources .env at startup.
      - name: Write .env on VPS
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMBEDDINGS_API_KEY: ${{ secrets.EMBEDDINGS_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret not set - skipping .env write (worker stays disabled)"
            exit 0
          fi
          printf 'LLM_BASE_URL=https://api.groq.com/openai/v1\nLLM_API_KEY=%s\nLLM_MODEL=openai/gpt-oss-20b\nLLM_TIMEOUT=60\nLLM_MAX_RUNS=3\n' "$GROQ_API_KEY" > /tmp/env_content
          # Embeddings come from a different provider (OpenRouter) and are what
          # grounding retrieves with. Compose only forwards variables it names, so
          # this block + the x-backend-env anchor is the whole delivery path.
          if [ -n "$EMBEDDINGS_API_KEY" ]; then
            printf 'EMBEDDINGS_BASE_URL=https://openrouter.ai/api/v1\nEMBEDDINGS_API_KEY=%s\nEMBEDDINGS_MODEL=openai/text-embedding-3-small\nEMBEDDINGS_DIMENSIONS=1536\n' "$EMBEDDINGS_API_KEY" >> /tmp/env_content
          else
            echo "EMBEDDINGS_API_KEY secret not set - grounding will return zero chunks" >&2
          fi
          for i in $(seq 1 3); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
                -p 2222 -i ~/.ssh/id_deploy \
                "$VPS_USER@127.0.0.1" "cat > /home/ubuntu/app/.env.tmp && mv /home/ubuntu/app/.env.tmp /home/ubuntu/app/.env && chmod 600 /home/ubuntu/app/.env" < /tmp/env_content 2>/tmp/ssh_env_err; then
              echo ".env written (600)"
              exit 0
            fi
            echo "write .env attempt $i/3 failed - retrying in 5s"
            cat /tmp/ssh_env_err
            sleep 5
          done
          echo ".env write FAILED after retries"
          cat /tmp/ssh_env_err
          exit 1

      - name: Deploy stack on VPS
        run: |
          for i in $(seq 1 3); do
            if timeout 26m ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 \
                -p 2222 -i ~/.ssh/id_deploy \
                $VPS_USER@127.0.0.1 "cd /home/ubuntu/app && timeout 25m bash scripts/deploy.sh" 2>/tmp/ssh_dep_err; then
              exit 0
            fi
            echo "deploy attempt $i/3 failed - retrying in 5s"
            cat /tmp/ssh_dep_err
            sleep 5
          done
          exit 1
