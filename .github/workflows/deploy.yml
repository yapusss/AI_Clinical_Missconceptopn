name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and restart stack
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Apply DB migrations
        run: docker compose exec -T backend python manage.py migrate

      - name: Seed demo user
        run: docker compose exec -T backend python manage.py seed_demo_user

      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000 > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "Backend OK"
              echo "Frontend OK"
              exit 0
            fi
            echo "waiting for services ($i/30)..."
            sleep 10
          done
          echo "Health check FAILED"
          exit 1

      - name: Prune old images
        run: docker image prune -f || true