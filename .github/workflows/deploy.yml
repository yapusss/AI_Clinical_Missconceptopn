name: Deploy to VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      VPS_HOST: 192.168.1.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print deploy target
        run: 'echo "Deploying to self-hosted runner on VPS host: $VPS_HOST"'

      - name: Rebuild and restart stack
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build

      - name: Apply DB migrations
        run: docker compose exec -T backend python manage.py migrate

      - name: Seed demo user
        run: docker compose exec -T backend python manage.py seed_demo_user

      - name: Verify health
        run: |
          for i in $(seq 1 120); do
            if docker compose exec -T backend python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=5).status == 200 else 1)" 2>/tmp/hc_backend.err \
              && docker compose exec -T frontend wget -q -O /dev/null --timeout=5 http://localhost:3000/ 2>/tmp/hc_frontend.err; then
              echo "Backend OK"
              echo "Frontend OK"
              exit 0
            fi
            echo "waiting for services ($i/120)... $(date +%T)"
            sleep 10
          done
          echo "Backend health error:"; cat /tmp/hc_backend.err 2>/dev/null || true
          echo "Frontend health error:"; cat /tmp/hc_frontend.err 2>/dev/null || true
          echo "--- container status ---"
          docker compose ps
          echo "Health check FAILED"
          exit 1

      - name: Prune old images
        run: docker image prune -f || true