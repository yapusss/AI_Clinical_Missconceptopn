services:
  frontend:
    # Clear any stale .next (the anonymous volume is seeded from the production
    # image) so the dev server always compiles the mounted source fresh.
    command: sh -c "rm -rf /app/.next/* /app/.next/.[!.]* 2>/dev/null; npm run dev -- -H 0.0.0.0"
    environment:
      # Windows bind mounts do not emit file-change events into the container,
      # so force polling to make hot reload work while developing on Windows.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
